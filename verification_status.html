<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Verification Status</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;

            background-image: url("bg.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 15px;
        }

        .status-container {
            width: min(100%, 550px);
            padding: 45px 50px;

            background: white;
            border-radius: 20px;

            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.15);

            text-align: center;
        }

        .check-icon {
            width: 70px;
            height: 70px;

            margin: 0 auto 20px;

            border-radius: 50%;

            background: #28a745;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 38px;
            font-weight: bold;
        }

        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 20px;
        }

        .message {
            color: #666;
            font-size: 15px;
            line-height: 1.6;

            margin-bottom: 25px;
        }

        .status-box {
            padding: 15px;

            background: #fff8e1;
            border: 1px solid #ffe082;

            border-radius: 10px;

            margin-bottom: 20px;
        }

        .status-label {
            display: block;

            color: #666;
            font-size: 13px;

            margin-bottom: 5px;
        }

        .status {
            color: #d68900;
            font-size: 18px;
            font-weight: bold;
        }

        .notification {
            color: #666;
            font-size: 14px;
            line-height: 1.5;

            margin-bottom: 30px;
        }

        .continue-btn {
            width: 100%;
            padding: 15px;

            border: none;
            border-radius: 10px;

            background: #007bff;
            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
        }

        .continue-btn:hover {
            background: #0056b3;
        }

        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            .status-container {
                width: 100%;
                padding: 35px 22px;
            }

            h1 {
                font-size: 25px;
            }

            .message {
                font-size: 14px;
            }
        }

        @media (max-width: 380px) {

            .status-container {
                padding: 30px 18px;
            }

            h1 {
                font-size: 23px;
            }

            .check-icon {
                width: 60px;
                height: 60px;
                font-size: 32px;
            }
        }
    </style>
</head>

<body>

    <div class="status-container">

        <div class="check-icon">
            ✓
        </div>

        <h1>
            Verification Submitted
        </h1>

        <p class="message">
            Your property verification application has been
            submitted successfully.
        </p>

        <p class="message">
            Our team will review your information and submitted
            documents before your property can be listed on Nestify.
        </p>

        <div class="status-box">

            <span class="status-label">
                Status
            </span>

            <span class="status">
                Pending Verification
            </span>

        </div>

        <p class="notification">
            We'll notify you once your verification is complete.
        </p>

        <button
            type="button"
            class="continue-btn"
            onclick="continueToNestify()">

            Continue to Nestify

        </button>

    </div>


    <script>

        function continueToNestify() {

            window.location.href = "index.html";

        }

    </script>

</body>
</html>
