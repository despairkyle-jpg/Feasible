<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create Account</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
             font-family: Arial, sans-serif;

            background-image: url("bg.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 15px;
        }

        .signup-container {
            width: min(100%, 550px);
            padding: 40px 50px;

            background: white;
            border-radius: 20px;

            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.15);
        }

        .signup-container h1 {
            text-align: center;
            margin-bottom: 30px;

            color: #333;
            font-size: 32px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;

            color: #333;
            font-weight: bold;
            font-size: 16px;
        }

        .input-group input {
            width: 100%;
            padding: 14px;

            border: 1px solid #ccc;
            border-radius: 10px;

            font-size: 16px;
            outline: none;
        }

        .input-group input:focus {
            border-color: #007bff;
        }

        .terms {
            display: flex;
            align-items: flex-start;
            gap: 10px;

            margin: 20px 0;

            font-size: 14px;
            color: #333;
            line-height: 1.5;
        }

        .terms input {
            margin-top: 3px;
            cursor: pointer;
        }

        .terms a {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }

        .create-btn {
            width: 100%;
            padding: 15px;

            border: none;
            border-radius: 10px;

            background: #007bff;
            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
        }

        .create-btn:hover {
            background: #0056b3;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;

            font-size: 14px;
            color: #333;
        }

        .login-link a {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }
        .login-link a:hover{
            color: #06488e;
            text-decoration: none;
            font-weight: bold;
        }

        /* PHONE */
        @media (max-width: 600px) {

            body {
                padding: 10px;
                align-items: flex-start;
            }

            .signup-container {
                width: 100%;
                padding: 35px 22px;
                margin: 20px 0;
            }

            .signup-container h1 {
                font-size: 28px;
            }

            .input-group input {
                padding: 13px;
            }
        }

        /* VERY SMALL PHONE */
        @media (max-width: 380px) {

            .signup-container {
                padding: 30px 18px;
            }

            .signup-container h1 {
                font-size: 25px;
            }

            .terms {
                font-size: 13px;
            }
        }

        /* LARGE LAPTOP / DESKTOP */
        @media (min-width: 1000px) {

            .signup-container {
                width: 600px;
                padding: 50px 60px;
            }

            .signup-container h1 {
                font-size: 36px;
            }
        }
    </style>
</head>

<body>

    <div class="signup-container">

        <h1>Create your account</h1>

        <form id="signupForm">

    <div class="input-group">
        <label for="fullname">Full Name</label>
        <input type="text"
               id="fullname"
               name="fullname"
               placeholder="Enter your full name"
               required>
    </div>

    <div class="input-group">
        <label for="email">Email Address</label>
        <input type="email"
               id="email"
               name="email"
               placeholder="Enter your email"
               required>
    </div>

    <div class="input-group">
        <label for="mobile">Mobile Number</label>
        <input type="tel"
               id="mobile"
               name="mobile"
               placeholder="09XX XXX XXXX"
               required>
    </div>

    <div class="input-group">
        <label for="password">Password</label>
        <input type="password"
               id="password"
               name="password"
               placeholder="Create a password"
               required>
    </div>

    <div class="input-group">
        <label for="confirm-password">Confirm Password</label>
        <input type="password"
               id="confirm-password"
               name="confirm_password"
               placeholder="Re-enter your password"
               required>
    </div>

    <label class="terms">
        <input type="checkbox"
               id="terms"
               name="terms"
               required>

        <span>
            I agree to the
            <a href="#">Terms & Conditions</a>
            and
            <a href="#">Privacy Policy</a>.
        </span>
    </label>

    <button type="submit" class="create-btn">
        Create Account
    </button>

</form>
<script>
    document.getElementById("signupForm").addEventListener("submit", function(event) {

        event.preventDefault();

        const fullname = document.getElementById("fullname").value.trim();
        const email = document.getElementById("email").value.trim();
        const mobile = document.getElementById("mobile").value.trim();
        const password = document.getElementById("password").value;
        const confirmPassword = document.getElementById("confirm-password").value;
        const terms = document.getElementById("terms").checked;


        // Check empty fields
        if (
            fullname === "" ||
            email === "" ||
            mobile === "" ||
            password === "" ||
            confirmPassword === ""
        ) {
            alert("Please fill up all fields.");
            return;
        }


        // Check password
        if (password !== confirmPassword) {
            alert("Passwords do not match.");
            return;
        }


        // Check terms
        if (!terms) {
            alert("Please agree to the Terms & Conditions and Privacy Policy.");
            return;
        }


        // SAVE PERSONAL INFORMATION
        localStorage.setItem("fullname", fullname);
        localStorage.setItem("email", email);
        localStorage.setItem("mobile", mobile);


        // Go to Screen 2
        window.location.href = "property_info.html";

    });
</script>

</body>
</html>
