<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Property Information</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;

            background-image: url("bg.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 15px;
        }

        .property-container {
            width: min(100%, 600px);
            padding: 40px 50px;

            background: white;
            border-radius: 20px;

            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.15);
        }

        .property-container h1 {
            text-align: center;
            color: #333;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            font-size: 15px;
            line-height: 1.5;
            margin-bottom: 30px;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            color: #333;
            margin-bottom: 20px;
        }

        .input-group {
            margin-bottom: 18px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;

            color: #333;
            font-weight: bold;
            font-size: 15px;
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 14px;

            border: 1px solid #ccc;
            border-radius: 10px;

            font-size: 16px;
            outline: none;
            background: white;
        }

        .input-group input:focus,
        .input-group select:focus {
            border-color: #007bff;
        }

        .continue-btn {
            width: 100%;
            padding: 15px;

            border: none;
            border-radius: 10px;

            background: #007bff;
            color: white;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;
            margin-top: 10px;
        }

        .continue-btn:hover {
            background: #0056b3;
        }

        @media (max-width: 600px) {

            body {
                padding: 10px;
                align-items: flex-start;
            }

            .property-container {
                width: 100%;
                padding: 35px 22px;
                margin: 20px 0;
            }

            .property-container h1 {
                font-size: 27px;
            }

            .subtitle {
                font-size: 14px;
            }

            .input-group input,
            .input-group select {
                padding: 13px;
            }
        }

        @media (max-width: 380px) {

            .property-container {
                padding: 30px 18px;
            }

            .property-container h1 {
                font-size: 24px;
            }
        }
    </style>
</head>

<body>

    <div class="property-container">

        <h1>Tell Us About Your Property</h1>

        <p class="subtitle">
            Add your property details so renters can find and learn more about your property.
        </p>

        <div class="section-title">
            Property Information
        </div>

        <form id="propertyForm">

            <div class="input-group">
                <label for="propertyName">
                    Property/Business Name
                </label>

                <input
                    type="text"
                    id="propertyName"
                    name="propertyName"
                    placeholder="Enter property or business name"
                    required>
            </div>

            <div class="input-group">
                <label for="propertyAddress">
                    Property Address
                </label>

                <input
                    type="text"
                    id="propertyAddress"
                    name="propertyAddress"
                    placeholder="Enter complete property address"
                    required>
            </div>

            <div class="input-group">
                <label for="propertyType">
                    Type of Property
                </label>

                <select id="propertyType" name="propertyType" required>

                    <option value="" disabled selected>
                        Select property type
                    </option>

                    <option value="Boarding House">
                        Boarding House
                    </option>

                    <option value="Apartment">
                        Apartment
                    </option>

                    <option value="Dormitory">
                        Dormitory
                    </option>

                    <option value="Bed Space">
                        Bed Space
                    </option>

                    <option value="Transient Room">
                        Transient Room
                    </option>

                </select>
            </div>

            <div class="input-group">
                <label for="units">
                    Number of Available Units/Rooms
                </label>

                <input
                    type="number"
                    id="units"
                    name="units"
                    placeholder="Enter number of available units/rooms"
                    min="1"
                    required>
            </div>

            <div class="input-group">
                <label for="contactPerson">
                    Contact Person
                </label>

                <input
                    type="text"
                    id="contactPerson"
                    name="contactPerson"
                    placeholder="Enter property contact person"
                    required>
            </div>

            <div class="input-group">
                <label for="contactNumber">
                    Contact Number
                </label>

                <input
                    type="tel"
                    id="contactNumber"
                    name="contactNumber"
                    placeholder="09XX XXX XXXX"
                    required>
            </div>

            <button type="submit" class="continue-btn">
                Continue
            </button>

        </form>

    </div>

   <script>
    document.getElementById("propertyForm").addEventListener("submit", function(event) {

        event.preventDefault();

        const propertyName = document.getElementById("propertyName").value.trim();
        const propertyAddress = document.getElementById("propertyAddress").value.trim();
        const propertyType = document.getElementById("propertyType").value;
        const units = document.getElementById("units").value;
        const contactPerson = document.getElementById("contactPerson").value.trim();
        const contactNumber = document.getElementById("contactNumber").value.trim();

        // Check if fields are empty
        if (
            propertyName === "" ||
            propertyAddress === "" ||
            propertyType === "" ||
            units === "" ||
            contactPerson === "" ||
            contactNumber === ""
        ) {
            alert("Please fill up all the required fields.");
            return;
        }

        // Save property information
        localStorage.setItem("propertyName", propertyName);
        localStorage.setItem("propertyAddress", propertyAddress);
        localStorage.setItem("propertyType", propertyType);
        localStorage.setItem("units", units);
        localStorage.setItem("contactPerson", contactPerson);
        localStorage.setItem("contactNumber", contactNumber);

        // Go to Screen 3
        window.location.href = "verify_property.html";

    });
</script>

</body>
</html>
