<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            height: 100vh;
            overflow: hidden;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(
                135deg,
                #65a5ef,
                #68a0e0
            );
        }

        /* Welcome container */
        .welcome-box {
            text-align: center;
            color: white;

            opacity: 0;
            transform: scale(0.5);

            animation: slowPop 2s ease-out forwards;
        }

        /* Logo */
        .logo {
            background-color: rgb(231, 231, 231);
            border-radius: 70px;
            width: 140px;
            height: 140px;
            object-fit: contain;

            margin-bottom: 20px;

            animation: logoFloat 2s ease-in-out infinite alternate;
        }

        /* WELCOME text */
        .welcome-box h1 {
            font-size: 50px;
            letter-spacing: 5px;
            margin-bottom: 20px;
        }

        /* Description */
        .welcome-box p {
            font-size: 20px;
            max-width: 500px;
            line-height: 1.6;
            opacity: 0.9;
        }

        /* Slow pop-up animation */
        @keyframes slowPop {
            0% {
                opacity: 0;
                transform: scale(0.5);
            }

            60% {
                opacity: 1;
                transform: scale(1.05);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        /* Slight logo movement */
        @keyframes logoFloat {
            from {
                transform: translateY(0);
            }

            to {
                transform: translateY(-10px);
            }
        }

        /* Fade out before login page */
        .fade-out {
            animation: fadeOut 1s ease forwards;
        }

        @keyframes fadeOut {
            from {
                opacity: 1;
            }

            to {
                opacity: 0;
            }
        }

        /* Mobile responsive */
        @media (max-width: 600px) {

            .logo {
                 border-radius: 60px;
                    width: 110px;
                     height: 110px;
            }

            .welcome-box h1 {
                font-size: 35px;
            }

            .welcome-box p {
                font-size: 16px;
                padding: 0 25px;
            }
        }
    </style>
</head>

<body>

    <div class="welcome-box" id="welcomeBox">

        <!-- Your Logo -->
        <img src="logo.jpg" alt="Logo" class="logo">

        <h1>WELCOME</h1>

        <p>
            Find trusted rental accommodations in Iloilo City.
        </p>

    </div>


    <script>

        // After 4 seconds, fade out
        setTimeout(function () {

            document.getElementById("welcomeBox")
                .classList.add("fade-out");

            // Go to login page after fade animation
            setTimeout(function () {
                window.location.href = "log_in.html";
            }, 1000);

        }, 4000);

    </script>

</body>
</html>
