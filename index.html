<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;

            background-image: url("bg.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;

            min-height: 100vh;
            min-height: 100dvh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 15px;
        }

        /* LOGIN BOX */
        .login-container {
            position: relative;

            width: min(100%, 550px);

            padding: 45px 50px;

            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

            background: rgba(255, 255, 255, 0.30);

            border-radius: 20px;

            box-shadow:
                0 5px 25px rgba(0, 0, 0, 0.20);
        }

        /* LOGO */
        .logo {
            position: absolute;

            top: -25px;
            left: -25px;

            width: 75px;
            height: 75px;

            object-fit: contain;

            border-radius: 50%;

            background: rgba(255, 255, 255, 0.30);

            padding: 5px;
        }

        /* TITLE */
        .login-container h1 {
            text-align: center;

            margin-bottom: 30px;

            color: #333;

            font-size: 32px;
        }

        /* INPUT GROUP */
        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;

            margin-bottom: 8px;

            color: #333;

            font-weight: bold;

            font-size: 16px;
        }

        .input-group input {
            width: 100%;

            padding: 15px;

            border: 1px solid #ccc;

            border-radius: 10px;

            font-size: 16px;

            outline: none;

            background: rgba(255, 255, 255, 0.90);
        }

        .input-group input:focus {
            border-color: #007bff;
        }

        /* LOGIN BUTTON */
        .login-btn {
            width: 100%;

            padding: 15px;

            border: none;

            border-radius: 10px;

            background: #007bff;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;
        }

        .login-btn:hover {
            background: #0056b3;
        }

        /* CONTINUE WITH */
        .continue-with {
            margin-top: 25px;
        }

        /* DIVIDER */
        .divider {
            display: flex;

            align-items: center;

            margin: 25px 0;

            color: #777;

            font-size: 14px;
        }

        .divider::before,
        .divider::after {
            content: "";

            flex: 1;

            height: 1px;

            background: #ddd;
        }

        .divider span {
            padding: 0 12px;
        }

        /* SOCIAL BUTTON */
        .social-btn {
            width: 100%;

            height: 50px;

            margin-bottom: 12px;

            border: 1px solid #ddd;

            border-radius: 10px;

            background: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            display: flex;

            align-items: center;

            justify-content: center;

            gap: 10px;
        }

        .social-btn:hover {
            background: #f5f5f5;
        }

        .google-icon {
            font-size: 20px;

            font-weight: bold;
        }

        .facebook-icon {
            background: #1877f2;

            color: white;

            width: 22px;
            height: 22px;

            border-radius: 50%;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 18px;
        }

        /* SIGN UP */
        .signup {
            text-align: center;

            margin-top: 22px;

            font-size: 14px;
        }

        .signup a {
            color: #007bff;

            text-decoration: none;

            font-weight: bold;
        }

        /* ===================================
           PHONE
        =================================== */

        @media (max-width: 600px) {

            body {
                padding: 10px;
            }

            .login-container {
                width: 100%;

                padding: 40px 25px;

                border-radius: 18px;
            }

            .login-container h1 {
                font-size: 28px;

                margin-bottom: 25px;
            }

            .logo {
                width: 65px;
                height: 65px;

                top: -20px;
                left: -10px;
            }

            .input-group input {
                padding: 14px;
            }

            .login-btn {
                padding: 14px;
            }
        }

        /* ===================================
           VERY SMALL PHONE
        =================================== */

        @media (max-width: 380px) {

            body {
                padding: 5px;
            }

            .login-container {
                padding: 35px 18px;

                border-radius: 15px;
            }

            .login-container h1 {
                font-size: 25px;
            }

            .logo {
                width: 58px;
                height: 58px;

                top: -15px;
                left: -5px;
            }
        }

        /* ===================================
           LARGE LAPTOP / DESKTOP
        =================================== */

        @media (min-width: 1000px) {

            .login-container {
                width: 600px;

                padding: 55px 60px;

                border-radius: 22px;
            }

            .login-container h1 {
                font-size: 36px;
            }

            .input-group input {
                padding: 16px;

                font-size: 17px;
            }

            .login-btn {
                padding: 16px;

                font-size: 18px;
            }

            .social-btn {
                height: 52px;

                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="login-container">

        <img src="logo.jpg" class="logo" alt="Logo">

        <h1>Login</h1>

        <form action="login.php" method="POST">

            <div class="input-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Username"
                    required
                >
            </div>

            <div class="input-group">
                <label for="password">Password</label>

                <input
                    type="password"
                    id="password"
                    name="password"
                    placeholder="Password"
                    required
                >
            </div>

            <button type="submit" class="login-btn">
                Login
            </button>

        </form>

        <div class="continue-with">

            <div class="divider">
                <span>Continue with</span>
            </div>

            <button type="button" class="social-btn google-btn">
                <span class="google-icon">G</span>
                Continue with Google
            </button>

            <button type="button" class="social-btn facebook-btn">
                <span class="facebook-icon">f</span>
                Continue with Facebook
            </button>

        </div>

        <div class="signup">
            Don't have an account?
            <a href="signup.html">Sign Up</a>
        </div>

    </div>

</body>
</html>
